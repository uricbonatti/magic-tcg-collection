services:
  api:
    build: .
    container_name: mtc-api
    ports:
      - "3333:3333"
    env_file: .env
    environment:
      MONGO_URL: mongodb://mongodb:27017
    depends_on:
      - mongodb

  mongodb:
    image: mongo:7
    container_name: mtc-mongodb
    volumes:
      - mtc-data:/data/db

volumes:
  mtc-data:
